name: Release Binary

on:
  push:
    tags:
      - 'v*.*.*'    # Triggers whenever a tag like v1.0.0 is pushed
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  build_and_release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2


      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3

      - name: Run Tests
        run: deno test

      - name: Compile Binary (Fedora Linux x86_64)
        run: |
          deno compile --allow-read --allow-write --allow-run --allow-env --target x86_64-unknown-linux-gnu --output yass-hat-linux-x86_64 src/main.ts

      - name: Compile Binary (Fedora Linux aarch64)
        run: |
          deno compile --allow-read --allow-write --allow-run --allow-env --target aarch64-unknown-linux-gnu --output yass-hat-linux-aarch64 src/main.ts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            yass-hat-linux-x86_64
            yass-hat-linux-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
